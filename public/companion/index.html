<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>SanRemes companion</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/companion/app.css">
</head>
<body>
<header>
  <h1>SanRemes companion</h1>
  <p id="subtitle">Your bots, on your phone.</p>
</header>
<nav aria-label="Views">
  <button type="button" data-view="bots" aria-pressed="true">Bots</button>
  <button type="button" data-view="running" aria-pressed="false">Running</button>
  <button type="button" data-view="settings" aria-pressed="false">Settings</button>
</nav>
<main>
  <section id="view-bots" aria-label="Bots"></section>
  <section id="view-running" aria-label="Running" hidden></section>
  <section id="view-settings" aria-label="Settings" hidden></section>
  <section id="view-thread" aria-label="Conversation" hidden></section>
</main>
<p id="status" role="status" aria-live="polite"></p>
<script src="/companion/app.js"></script>
</body>
</html>
