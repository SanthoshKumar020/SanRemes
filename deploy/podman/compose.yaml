name: ${COMPOSE_PROJECT_NAME:-sanremes-podman}
services:
  sanremes:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/sanremes-podman:${SANREMES_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${SANREMES_DATA_ROOT:?Run setup.sh first}:${SANREMES_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/sanremes-podman.sock
    environment:
      HOME: ${SANREMES_DATA_ROOT}
      SANREMES_DATA_DIR: ${SANREMES_DATA_ROOT}/.sanremes
      SANREMES_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/sanremes-podman.sock
      SANREMES_PORT: ${SANREMES_PORT:-8799}
      SANREMES_WEBHOOK_PORT: ${SANREMES_WEBHOOK_PORT:-8800}
      SANREMES_PUBLIC_URL: ${SANREMES_PUBLIC_URL:-http://localhost:8080}
      SANREMES_WEBHOOK_PUBLIC_URL: ${SANREMES_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$SANREMES_PORT/api/health | grep -q sanremes']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      sanremes:
        condition: service_healthy
    environment:
      SANREMES_HTTP_PORT: ${SANREMES_HTTP_PORT:-8080}
      SANREMES_PORT: ${SANREMES_PORT:-8799}
      SANREMES_WEBHOOK_PORT: ${SANREMES_WEBHOOK_PORT:-8800}
      SANREMES_HTTPS_HOST: ${SANREMES_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
