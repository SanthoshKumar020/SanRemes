name: ${COMPOSE_PROJECT_NAME:-sanremes}
services:
  sanremes:
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${SANREMES_BASE_IMAGE:-ghcr.io/milind-soni/openmausbot:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${SANREMES_LOCAL_IMAGE:-sanremes-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
      - edge:/run/sanremes
    environment:
      SANREMES_PORT: "8799"
      SANREMES_WEBHOOK_PORT: "8800"
      # Caddy, in its own container, reaches the server over these (deploy/local/Caddyfile). A request on a socket is
      # never a local one. Caddy does not share the server's network: a server restarted on its own would come back
      # in a new one and leave Caddy, and the port, behind in the old one.
      SANREMES_TUNNEL_SOCKET: /run/sanremes/http.sock
      SANREMES_WEBHOOK_SOCKET: /run/sanremes/hooks.sock
      # The name the desktop app shows for this server (a container's own hostname is a random id).
      SANREMES_SERVER_NAME: ${SANREMES_SERVER_NAME:-sanremes-docker}
      SANREMES_PUBLIC_URL: ${SANREMES_PUBLIC_URL:-http://localhost:${SANREMES_HTTP_PORT:-8080}}
      SANREMES_WEBHOOK_PUBLIC_URL: ${SANREMES_WEBHOOK_PUBLIC_URL:-${SANREMES_PUBLIC_URL:-http://localhost:${SANREMES_HTTP_PORT:-8080}}}
      # "1": phones pair by QR through SanRemes Relay (docs/phone-relay-server.md). Sign the
      # container in once first: docker compose exec sanremes sanremes login --relay
      SANREMES_PHONE_RELAY: ${SANREMES_PHONE_RELAY:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('sanremes')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "${SANREMES_BIND_ADDRESS:-127.0.0.1}:${SANREMES_HTTP_PORT:-8080}:80"
    environment:
      SANREMES_HTTPS_HOST: ${SANREMES_HTTPS_HOST:-}
      SANREMES_BIND_ADDRESS: ${SANREMES_BIND_ADDRESS:-127.0.0.1}
      SANREMES_TRUSTED_PROXY_CIDRS: ${SANREMES_TRUSTED_PROXY_CIDRS:-}
    command:
      - /bin/sh
      - -ec
      - |
        # HTTPS is claimed by the peer that terminates TLS, so a bind address
        # that others can reach has to name that peer.
        if [ -n "$$SANREMES_HTTPS_HOST" ] && [ "$$SANREMES_BIND_ADDRESS" != "127.0.0.1" ] && [ -z "$$SANREMES_TRUSTED_PROXY_CIDRS" ]; then
          echo "SANREMES_HTTPS_HOST with SANREMES_BIND_ADDRESS=$$SANREMES_BIND_ADDRESS requires SANREMES_TRUSTED_PROXY_CIDRS naming the TLS terminator; forward HTTPS through that terminator." >&2
          exit 1
        fi
        # An empty list lets any peer claim the HTTPS hostname, which only the
        # loopback bind keeps to the host itself.
        export SANREMES_TRUSTED_PROXY_CIDRS="$${SANREMES_TRUSTED_PROXY_CIDRS:-0.0.0.0/0 ::/0}"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # Started with the server, not after it is healthy: Caddy reaches it over the socket
    # whenever it answers, so `up` never waits on the server's health, and HTTPS is back
    # as soon as a restarted server is.
    depends_on:
      sanremes:
        condition: service_started
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge:/run/sanremes
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${SANREMES_DATA_EXTERNAL:-false}
    name: ${SANREMES_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-sanremes}_data}
  # The two sockets: in memory, made afresh by the server at each start. Not under /data, which every bot's sandbox
  # sees; the sandbox has its own /run.
  edge:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=1777,size=1m
  caddy_data:
  caddy_config:
